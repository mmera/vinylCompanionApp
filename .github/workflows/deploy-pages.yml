name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/crate-vinyl-ios-app-3vw9eb
  workflow_dispatch:

# Least privilege: read the repo, mint an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    env:
      # Belt and braces. `.env` is gitignored so it never reaches CI, and the
      # build script refuses to publish a bundle containing credentials — this
      # makes the intent explicit for anyone reading the workflow.
      EXPO_NO_DOTENV: '1'
      # Public by design: under PKCE the Spotify client ID is an identifier,
      # not a secret, and it must ship in the bundle for sign-in to work.
      # Set it as a repository *variable* (Settings -> Secrets and variables ->
      # Actions -> Variables), not a secret.
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and audit for leaked credentials
        # Exits non-zero if any API key made it into the output, which fails
        # the deploy instead of publishing a secret to a public URL.
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
